*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:14px 64px;-webkit-font-smoothing:antialiased;margin:0}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
h1,h2,h3{font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:clamp(21px,4.6vw,25px);line-height:1.2}
p{margin:0} a{color:var(--sea);text-underline-offset:3px} button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:3px}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
.lab{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.draft{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--clay);background:var(--clay-soft);border-radius:999px;padding:4px 11px}
.hero{gap:14px}
.hero h1{font-size:clamp(29px,7vw,40px);line-height:1.08}
.lead1{font-size:18px;line-height:1.5;max-width:60ch}
.story{gap:0}
.stick{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 8px);z-index:5;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--bg);box-shadow:0 10px 26px -18px rgba(0,0,0,.45)}
.stage{position:relative;aspect-ratio:720/440;background:var(--sky)}
.stage canvas,.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage svg{font-family:var(--sans)}
.dots{position:absolute;left:0;right:0;top:8px;display:flex;justify-content:center;gap:4px;pointer-events:none}
.dots i{width:5px;height:5px;border-radius:999px;background:var(--ink);opacity:.22;transition:opacity .25s,transform .25s}
.dots i.on{opacity:.85;transform:scale(1.4)}
.steps2{display:flex;flex-direction:column}
.step{min-height:82vh;display:flex;align-items:flex-start}
.step:first-child{min-height:64vh}
.step:last-child{min-height:70vh}
.step p{position:sticky;top:calc(var(--stb,300px) + 22px);font-size:clamp(18.5px,4.8vw,21.5px);line-height:1.42;max-width:31em;opacity:0;transition:opacity .22s;padding-bottom:22px}
.step p.gone{opacity:0;transition:none}
.step.on p{opacity:1}
.step.near p{opacity:.22}
sup{font-size:.62em;line-height:0;color:var(--sea);font-weight:600;margin-left:1px}
sup a{color:inherit;text-decoration:none}
.hint{position:fixed;left:50%;bottom:calc(max(14px, env(safe-area-inset-bottom, 0px)));transform:translateX(-50%);z-index:6;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:999px;padding:9px 13px 9px 16px;font:600 14.5px var(--sans);cursor:pointer;white-space:nowrap;box-shadow:0 8px 22px -14px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.hint.show{opacity:1;pointer-events:auto}
.hint.mini{padding:9px;opacity:0}
.hint.mini.show{opacity:.82}
.hint.mini span{display:none}
.hint svg{width:18px;height:18px;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
.scrim{position:fixed;left:0;right:0;bottom:0;height:104px;z-index:5;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--bg) 58%);opacity:0;transition:opacity .3s}
.scrim.show{opacity:1}
@media (prefers-reduced-motion: reduce){ .hint svg{animation:none} .step p{transition:none} }
.sub{color:var(--muted);font-size:15px;max-width:66ch}
.txt p,.txt li{max-width:66ch}
.lg{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;color:var(--muted);line-height:1.4}
.lg span{white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.lg svg{width:30px;height:14px;flex:none;overflow:visible}
.callout{padding:18px 20px;border-radius:18px;background:var(--sea-soft)}
.callout h2{color:var(--sea)}
.plan{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:9px}
.notes{margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.notes a{overflow-wrap:anywhere}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.wlist li{display:grid;grid-template-columns:6.6em minmax(0,1fr);column-gap:12px;row-gap:1px;padding:9px 0;border-bottom:1px solid var(--line);max-width:none}
.wd{grid-row:1/3;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.wn{font-size:16px}
.wn b{font-weight:600}
.fl{font-style:normal;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.fo{color:var(--o)} .fi{color:var(--i)} .fy{color:var(--y)}
.wh{font-size:14px;color:var(--muted)}

const hex=k=>{ let v=getComputedStyle(document.documentElement).getPropertyValue(k).trim(); if(v.length===4) v="#"+v[1]+v[1]+v[2]+v[2]+v[3]+v[3]; return [parseInt(v.slice(1,3),16),parseInt(v.slice(3,5),16),parseInt(v.slice(5,7),16)]; };
const pk=(r,g,b)=>(255<<24|(b&255)<<16|(g&255)<<8|(r&255))>>>0, COL={}; let SKY="#EEF3F2";
function colors(){ for(const k of ["land","coast","s0","s1"]) COL[k]=hex("--m-"+k); SKY=getComputedStyle(document.documentElement).getPropertyValue("--sky").trim()||SKY; }
const mY=la=>Math.log(Math.tan(Math.PI/4+la*Math.PI/360));
const cv=$("#cv"), ctx=cv.getContext("2d"), CW=VID?VID.w*2:1440, CH=VID?VID.h*2:880, ov=$("#ov"); cv.width=CW; cv.height=CH; ov.setAttribute("viewBox",`0 0 ${VW} ${VH}`);
for(const k in MAPS){ const m=MAPS[k]; m.c=document.createElement("canvas"); m.c.width=m.w; m.c.height=m.h; m.x=m.c.getContext("2d"); m.ok=0; m.Y1=mY(m.la1); m.YS=m.h/(mY(m.la1)-mY(m.la0)); m.XS=m.w/(m.lo1-m.lo0); }
const mx=(m,lo)=>(lo-m.lo0)*m.XS, my=(m,la)=>(m.Y1-mY(la))*m.YS;
function paint(m){ if(!m.ok) return; const V=m.V, N=V.length, W=m.w, C=COL, sea=new Uint32Array(128), land=new Uint32Array(32), co=pk(C.coast[0],C.coast[1],C.coast[2]), o=m.o;
  for(let e=0;e<128;e++){ const t=e/127; sea[e]=pk(lerp(C.s0[0],C.s1[0],t),lerp(C.s0[1],C.s1[1],t),lerp(C.s0[2],C.s1[2],t)); }
  for(let s=0;s<32;s++){ const f=1+(s-19.8)*.0102; land[s]=pk(Math.min(255,C.land[0]*f),Math.min(255,C.land[1]*f),Math.min(255,C.land[2]*f)); }
  for(let i=0;i<N;i++){ const v=V[i]; if(v<128) o[i]=sea[v]; else { const x=i%W, c=(x>0&&V[i-1]<128)||(x<W-1&&V[i+1]<128)||(i>=W&&V[i-W]<128)||(i<N-W&&V[i+W]<128); o[i]=c?co:land[(v-128)>>2]; } }
  /* taktik temada kıyı çizgisi parlar: kıyıya 1–3 piksel yakın denize ışık sızar */
  if(document.documentElement.dataset.theme==="taktik"){ const H=m.h, uz=new Uint8Array(N).fill(9);
    for(let i=0;i<N;i++) if(o[i]===co) uz[i]=0;
    for(let r=1;r<=3;r++) for(let i=0;i<N;i++){ if(uz[i]!==9||V[i]>=128) continue; const x=i%W; if((x>0&&uz[i-1]===r-1)||(x<W-1&&uz[i+1]===r-1)||(i>=W&&uz[i-W]===r-1)||(i<N-W&&uz[i+W]===r-1)) uz[i]=r; }
    for(let i=0;i<N;i++){ const r=uz[i]; if(r<1||r>3) continue; const a=[.55,.3,.14][r-1], v=V[i], b=sea[v];
      o[i]=pk(lerp(b&255,C.coast[0],a),lerp((b>>8)&255,C.coast[1],a),lerp((b>>16)&255,C.coast[2],a)); } }

function paintGece(m){ if(!m.ok||m.cN) return m.cN; const V=m.V, N=V.length, W=m.w, c=document.createElement("canvas"); c.width=m.w; c.height=m.h; const x=c.getContext("2d"), im=x.createImageData(m.w,m.h), o=new Uint32Array(im.data.buffer);

  for(let k=0;k<32;k++){ const f=1+(k-19.8)*.03; land[k]=pk(Math.min(255,92*f),Math.min(255,102*f),Math.min(255,120*f)); }
  for(let i=0;i<N;i++){ const v=V[i]; if(v<128) o[i]=sea[v]; else { const X=i%W, kiyi=(X>0&&V[i-1]<128)||(X<W-1&&V[i+1]<128)||(i>=W&&V[i-W]<128)||(i<N-W&&V[i+W]<128); o[i]=kiyi?co:land[(v-128)>>2]; } }

/* dikey kadraj: adımın hareketlerini ve etiketlerini sığdıran en yakın plan.
   vcamFix {lo,la,w} elle kadraj; vk en dar yakınlık (yatay kameranın genişliğine oranı, varsayılan .42). */
/* AT/AB: üstte tarih etiketi, altta altyazı için ayrılan pay (kadraj oranı) */
const AT=VID?((VID.top||0)+60)/VID.h:0, AB=VID?(VID.alt||0):0;
function vrect(c){ const m=c.m; if(c.vcamFix) return camRect(m,c.vcamFix);
  const L=camRect(m,c.cam), minW=(c.vk||.42)*L[2], maxW=Math.min(m.w,m.h*VW/VH);
  const fit=P=>{ if(!P.length) return null; let w=L[2]*.6, box;
    for(let it=0;it<4;it++){ const k=VW/w; let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
      for(const p of P){ x0=Math.min(x0,p[0]-p[2]/k); x1=Math.max(x1,p[0]+p[3]/k); y0=Math.min(y0,p[1]-p[4]/k); y1=Math.max(y1,p[1]+p[5]/k); }
      box=[x0,x1,y0,y1]; w=Math.max((x1-x0)*1.12,(y1-y0)*1.08*VW/(VH*(1-AT-AB)),minW); }
    return {w,cx:(box[0]+box[1])/2,cy:(box[2]+box[3])/2}; };
  let r=fit(c.F)||{w:L[2]*.6,cx:L[0]+L[2]/2,cy:L[1]+L[3]/2};
  if(r.w>1.7*L[2]&&c.Fs.length) r=fit(c.Fs);   /* sığmazsa önce hareket */
  const w=Math.min(r.w,maxW), h=w*VH/VW; return [clamp(r.cx-w/2,0,m.w-w),clamp(r.cy-h*(AT+(1-AT-AB)/2),0,m.h-h),w,h]; }
const camOf=c=>VID?c.vr:camRect(c.m,c.cam);
