*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:14px 64px;-webkit-font-smoothing:antialiased;margin:0}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:44px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.draft{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--clay);background:var(--clay-soft);border-radius:999px;padding:4px 11px}
.hero{gap:14px}

.lead1{font-size:18px;line-height:1.5;max-width:60ch}
.story{gap:0}

.dots i{width:5px;height:5px;border-radius:999px;background:var(--ink);opacity:.22;transition:opacity .25s,transform .25s}
.dots i.on{opacity:.85;transform:scale(1.4)}
.steps2{display:flex;flex-direction:column}
.step{min-height:82vh;display:flex;align-items:flex-start}
.step:first-child{min-height:64vh}
.step:last-child{min-height:70vh}
.step p{position:sticky;top:calc(var(--stb,300px) + 22px);font-size:clamp(18.5px,4.8vw,21.5px);line-height:1.42;max-width:31em;opacity:0;transition:opacity .22s;padding-bottom:22px}
.step p.gone{opacity:0;transition:none}
.step.on p{opacity:1}
.step.near p{opacity:.22}
sup{font-size:.62em;line-height:0;color:var(--sea);font-weight:600;margin-left:1px}
sup a{color:inherit;text-decoration:none}
.hint{position:fixed;left:50%;bottom:calc(max(14px, env(safe-area-inset-bottom, 0px)));transform:translateX(-50%);z-index:6;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:999px;padding:9px 13px 9px 16px;font:600 14.5px var(--sans);cursor:pointer;white-space:nowrap;box-shadow:0 8px 22px -14px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.hint.show{opacity:1;pointer-events:auto}
.hint.mini{padding:9px;opacity:0}
.hint.mini.show{opacity:.82}
.hint.mini span{display:none}
.hint svg{width:18px;height:18px;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
.scrim{position:fixed;left:0;right:0;bottom:0;height:104px;z-index:5;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--bg) 58%);opacity:0;transition:opacity .3s}
.scrim.show{opacity:1}

.sub{color:var(--muted);font-size:15px;max-width:66ch}
.txt p,.txt li{max-width:66ch}
.lg{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;color:var(--muted);line-height:1.4}
.lg span{white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.lg svg{width:30px;height:14px;flex:none;overflow:visible}
.callout{padding:18px 20px;border-radius:18px;background:var(--sea-soft)}
.callout h2{color:var(--sea)}
.plan{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:9px}
.notes{margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.notes a{overflow-wrap:anywhere}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.wlist li{display:grid;grid-template-columns:6.6em minmax(0,1fr);column-gap:12px;row-gap:1px;padding:9px 0;border-bottom:1px solid var(--line);max-width:none}
.wd{grid-row:1/3;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.wn{font-size:16px}
.wn b{font-weight:600}
.fl{font-style:normal;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.fo{color:var(--o)} .fi{color:var(--i)}
.wh{font-size:14px;color:var(--muted)}
